plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

kotlin {
  jvmToolchain(17)
}

android {
  namespace 'com.audiobookshelf.wear'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    // Must match the phone app so both can talk over the Wearable Data Layer
    applicationId "com.audiobookshelf.app"
    minSdkVersion 30
    targetSdkVersion 34
    // Watch APKs share the phone app's Play listing, so they need their own version code range
    versionCode 10000121
    versionName "0.14.2-beta-wear"
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  buildTypes {
    debug {
      // Matches the phone app's debug suffix so debug builds pair with each other
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
  implementation composeBom

  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

  // Compose for Wear OS
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.wear.compose:compose-material:1.4.1'
  implementation 'androidx.wear.compose:compose-foundation:1.4.1'
  implementation 'androidx.wear.compose:compose-navigation:1.4.1'
  implementation 'androidx.wear:wear-input:1.2.0'

  // Playback
  implementation 'androidx.media3:media3-exoplayer:1.5.1'
  implementation 'androidx.media3:media3-session:1.5.1'
  implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'

  // Downloads
  implementation 'androidx.work:work-runtime-ktx:2.10.0'

  // Networking and images
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'io.coil-kt:coil-compose:2.7.0'

  // Phone <-> watch Data Layer
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation 'com.google.guava:guava:33.3.1-android'
}
