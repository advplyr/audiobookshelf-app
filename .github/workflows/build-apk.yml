name: Build APK

on:
  push:
    branches:
      - android-tv-dpad-navigation
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    branches:
      - android-tv-dpad-navigation
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  workflow_dispatch: {}
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: create debug keystore (release variant signs with it; a fresh CI runner has none)
        run: |
          set -e
          for ks in "$HOME/.config/.android/debug.keystore" "$HOME/.android/debug.keystore"; do
            mkdir -p "$(dirname "$ks")"
            if [ ! -f "$ks" ]; then
              keytool -genkeypair -v -keystore "$ks" \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      - name: build Android app
        run: ./android/gradlew assembleRelease -p android --no-daemon

      - name: rename apk
        run: |
          set -e
          src="$(find android/app/build/outputs/apk -name '*.apk' -print -quit)"
          if [ -z "$src" ]; then
            echo "No APK produced under android/app/build/outputs/apk"; exit 1
          fi
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          mkdir -p android/app/build/outputs/apk/debug
          mv -v "$src" "android/app/build/outputs/apk/debug/audiobookshelf-${build}.apk"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk
